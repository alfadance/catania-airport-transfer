name: Deploy to Bluehost # CI deploy to production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Il CSS pubblicato è quello nel repository: se non corrisponde ai sorgenti, il deploy si ferma
      - name: Check that assets/tailwind.css is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code assets/tailwind.css || { echo "::error::assets/tailwind.css non aggiornato: lancia npm run build:css e fai commit"; exit 1; }

      # Un errore di sintassi in un .php manderebbe online un modulo rotto: il deploy si ferma prima
      - name: Check PHP syntax
        run: for f in *.php; do php -l "$f" || exit 1; done

      # Le pagine della nuova veste (veste/src) sono generate e i file generati stanno nel repository:
      # se non corrispondono ai modelli, il deploy si ferma. git status vede anche i file nuovi non tracciati.
      - name: Check that the generated pages are up to date
        run: |
          node veste/build.mjs
          test -z "$(git status --porcelain)" || { git status --short; git diff --stat; echo "::error::Pagine generate non aggiornate: lancia node veste/build.mjs e fai commit"; exit 1; }

      - name: Run veste tests
        run: node --test veste/*.test.mjs

      # Il CSS ha un nome fisso: l'impronta del contenuto nell'indirizzo lo rende nuovo a ogni modifica,
      # così browser e CDN possono tenerlo in cache a lungo (vedi .htaccess) senza servire una versione vecchia.
      # Ogni pagina punta a tailwind.css (vecchia veste) o a styles.css (nuova veste), con o senza "/" iniziale.
      - name: Version the CSS URL
        run: |
          pages="index.html contact-us/index.html partners/index.html privacy.html events.html wedding-transfers-taormina.html event-transportation-sicily.html book-a-transfer.html prices.html terms.html payment-status.html catania-airport-to-catania.html catania-airport-to-giardini-naxos.html catania-airport-to-milazzo.html catania-airport-to-siracusa.html catania-airport-to-taormina.html"
          # Pagine ancora senza un riferimento al CSS (in lavorazione): si saltano con un avviso invece di fermare il deploy
          pending="decidi.html"
          for f in $pages $pending; do
            found=0
            for css in tailwind styles; do
              grep -Eq "href=\"/?assets/$css\.css\"" "$f" || continue
              v=$(sha256sum "assets/$css.css" | cut -c1-10)
              sed -i -E "s#href=\"(/?assets/$css\.css)\"#href=\"\1?v=$v\"#" "$f"
              grep -Eq "href=\"/?assets/$css\.css\?v=$v\"" "$f" || { echo "::error::$f: impronta del CSS non scritta"; exit 1; }
              found=1
            done
            if [ "$found" = 0 ]; then
              case " $pending " in
                *" $f "*) echo "::warning::$f: nessun riferimento al CSS, saltato" ;;
                *) echo "::error::$f: riferimento al CSS non trovato"; exit 1 ;;
              esac
            fi
          done

      - name: Sync files to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            scripts/**
            package.json
            package-lock.json
            tailwind.config.cjs
            *.md
            .impeccable/**
