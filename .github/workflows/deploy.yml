name: Deploy to Bluehost # CI deploy to production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Il CSS pubblicato è quello nel repository: se non corrisponde ai sorgenti, il deploy si ferma
      - name: Check that assets/tailwind.css is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code assets/tailwind.css || { echo "::error::assets/tailwind.css non aggiornato: lancia npm run build:css e fai commit"; exit 1; }

      # Il CSS ha un nome fisso: l'impronta del contenuto nell'indirizzo lo rende nuovo a ogni modifica,
      # così browser e CDN possono tenerlo in cache a lungo senza servire una versione vecchia
      - name: Version the CSS URL
        run: |
          v=$(sha256sum assets/tailwind.css | cut -c1-10)
          for f in index.html privacy.html; do
            grep -q 'href="assets/tailwind.css"' "$f" || { echo "::error::$f: riferimento al CSS non trovato"; exit 1; }
            sed -i "s#href=\"assets/tailwind.css\"#href=\"assets/tailwind.css?v=$v\"#" "$f"
          done
          grep -c "tailwind.css?v=$v" index.html privacy.html

      - name: Sync files to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            scripts/**
            package.json
            package-lock.json
            tailwind.config.cjs
            *.md
            .impeccable/**
