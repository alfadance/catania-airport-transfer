<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050608">
<title>Servizi</title>
<style>
:root{--nero:#050608;--navy:#1B3F5D;--arancio:#EE8211;--mist:#F4F6F9;--carta:#fff;--testo:#14202b;--grigio:#56626e;--linea:#e3e8ee;--neg:#a1280f;--ok:#1b7a4b}
@media (prefers-color-scheme:dark){:root{--mist:#0d1218;--carta:#171f28;--testo:#e8edf2;--grigio:#9fabb7;--linea:#26313c;--neg:#ff8a73;--ok:#5fd39b;--navy:#7fb2de}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--testo);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--nero);color:#fff;padding:14px 16px 0;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:19px;font-weight:700}
header p{margin:3px 0 8px;font-size:13px;color:#c9d1da}
header p.vecchio{color:#ffb86b}
.tabs{display:flex;margin:0 -16px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:#c9d1da;font:600 15px system-ui,sans-serif;padding:11px 4px;min-height:44px;cursor:pointer}
.tabs button[aria-selected=true]{color:#fff;border-color:var(--arancio)}
main{max-width:640px;margin:0 auto;padding-bottom:40px}
.giorno{padding:16px 16px 4px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.c{margin:8px 12px;background:var(--carta);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(5,6,8,.14)}
.c.annullato{opacity:.6}
.r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ora{font-size:30px;font-weight:800;line-height:1}
.mezzo{font-size:13px;font-weight:600;color:var(--navy)}
.tm{display:inline-block;font-size:12px;font-weight:700;line-height:1.2;border-radius:999px;padding:3px 10px;white-space:nowrap;margin-top:3px;background:#e3edf7;color:#17406b}
.tm.minivan{background:#dff3e8;color:#14603a}
.tm.bus{background:#ece4f7;color:#52307f}
.tm.altro{background:#e8ebef;color:#3b4652}
@media (prefers-color-scheme:dark){.tm{background:#1d3550;color:#a9d0f5}.tm.minivan{background:#17372a;color:#8fe0b5}.tm.bus{background:#33274a;color:#cfb6f2}.tm.altro{background:#2a323b;color:#c4ccd5}}
.tratta{margin:10px 0 6px;line-height:1.35}
.tratta small{display:block;color:var(--grigio);font-size:13px}
.tratta a{color:inherit}
.riga{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:14px}
.volo{background:var(--mist);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 14px;border-radius:10px;min-height:44px;line-height:24px}
@media (prefers-color-scheme:dark){.btn{color:#050608}}
.inc{margin-top:10px;background:var(--arancio);color:var(--nero);border-radius:10px;padding:10px 12px}
.inc small{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.inc b{font-size:26px;font-weight:800}
.nonInc{margin-top:10px;background:var(--mist);color:var(--navy);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
.quota{margin-top:8px;display:flex;justify-content:space-between;font-size:14px;background:var(--mist);border-radius:8px;padding:8px 10px}
.nota{margin-top:8px;font-size:13px;color:var(--grigio);border-left:3px solid var(--navy);padding-left:8px;white-space:pre-wrap}
.ann{display:inline-block;background:var(--neg);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.id{margin-top:8px;font-size:11px;color:var(--grigio)}
.riepilogo{margin:12px;background:var(--carta);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(5,6,8,.14)}
.riepilogo .mese{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.riepilogo .big{font-size:32px;font-weight:800;margin:2px 0}
.riepilogo .sub,.sub{font-size:13px;color:var(--grigio)}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.saldo{margin-top:8px;background:var(--navy);color:#fff;border-radius:10px;padding:12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between}
@media (prefers-color-scheme:dark){.saldo{color:#050608}}
.mesi{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 0;-webkit-overflow-scrolling:touch}
.mesi button{flex:none;border:1px solid var(--linea);background:var(--carta);color:var(--testo);border-radius:999px;padding:8px 14px;font:600 14px system-ui,sans-serif;min-height:40px;cursor:pointer;text-transform:capitalize}
.mesi button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.mesi button[aria-pressed=true]{color:#050608}}
input[type=search]{display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:11px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--carta);color:var(--testo);font:16px system-ui,sans-serif;min-height:44px}
.lista{margin:12px;background:var(--carta);border-radius:14px;box-shadow:0 1px 3px rgba(5,6,8,.14);overflow:hidden}
.riga-el{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--linea);color:inherit;font:inherit;padding:11px 14px;cursor:pointer;min-height:44px}
.riga-el:first-child{border-top:0}
.riga-el .a{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.riga-el .t{font-weight:600}
.riga-el .q{font-weight:800;white-space:nowrap}
.riga-el .m{font-size:12px;font-weight:600;color:var(--navy)}
.riga-el .d{font-size:12px;color:var(--grigio)}
.riga-el .badge{float:right;margin-top:-18px;background:var(--arancio);color:var(--nero);font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px}
.riga-el.annullato .t{text-decoration:line-through}
.dentro{padding:0 2px 8px;border-top:1px solid var(--linea)}
.dentro .c{box-shadow:none;margin:6px 8px;background:var(--mist)}
.neg{color:var(--neg)}.pos{color:var(--ok)}
.vuoto,.errore{margin:40px 20px;text-align:center;color:var(--grigio)}
.errore b{display:block;color:var(--testo);font-size:18px;margin-bottom:6px}
.fine{padding:18px 16px;font-size:12px;color:var(--grigio);text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="titolo">Servizi</h1>
  <p id="agg">Carico…</p>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</header>
<main id="vista"></main>
<script>
"use strict";
const API = "https://lsekwlvnlumjxliyysuy.supabase.co/functions/v1/servizi-fornitore";
const token = (location.hash || "").replace(/^#/, "").trim();
const S = { dati: null, tab: "prossimi", mese: null, q: "", aperto: null, offline: false };

const h = (tag, attrs, ...figli) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of figli.flat()) if (f != null && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)));
  return e;
};
const euro = (n) => "€" + Number(n).toLocaleString("it-IT", { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const oggiRoma = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Rome" }).format(new Date());
const dt = (iso) => new Date(iso + "T12:00:00");
const giornoBreve = (iso) => new Intl.DateTimeFormat("it-IT", { weekday: "short", day: "numeric", month: "short" }).format(dt(iso));
const nomeMese = (ym) => new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" }).format(dt(ym + "-15"));
const luogo = (s) => {
  const t = String(s || "").trim();
  if (/aeroporto|airport|\bCTA\b/i.test(t)) return "Aeroporto CTA";
  return (t.split(",")[0] || t).slice(0, 44) || "—";
};
const mappa = (s) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s);

function giornoLabel(iso) {
  const o = oggiRoma();
  const domani = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Rome" }).format(new Date(Date.now() + 864e5));
  if (iso === o) return "Oggi · " + giornoBreve(iso);
  if (iso === domani) return "Domani · " + giornoBreve(iso);
  return giornoBreve(iso);
}

function tipoMezzo(m) {
  const t = (m || "").toLowerCase();
  return /standard|economy|minivan|van/.test(t) ? "minivan" : /bus/.test(t) ? "bus" : /sedan/.test(t) ? "sedan" : "altro";
}
const badgeMezzo = (m) => m ? h("span", { class: "tm " + tipoMezzo(m) }, m) : null;

function card(s, titolare) {
  return h("div", { class: "c" + (s.annullato ? " annullato" : "") },
    s.annullato && h("span", { class: "ann" }, "ANNULLATO"),
    h("div", { class: "r1" }, h("span", { class: "ora" }, s.ora || "—"), h("span", { class: "mezzo" }, badgeMezzo(s.mezzo), s.tipo && s.tipo !== "Transfer" ? " " + s.tipo : "")),
    h("div", { class: "tratta" }, h("a", { href: mappa(s.da), target: "_blank", rel: "noopener" }, s.da || "—"),
      h("small", {}, "→ ", h("a", { href: mappa(s.a), target: "_blank", rel: "noopener" }, s.a || "—"))),
    h("div", { class: "riga" }, h("b", {}, [s.pax ? s.pax + " pax" : "", s.nome].filter(Boolean).join(" · ")),
      s.volo && h("span", { class: "volo" }, "✈ " + s.volo + (s.provenienza ? " da " + s.provenienza : ""))),
    s.tel && h("div", { class: "riga" }, h("a", { class: "btn", href: "tel:" + s.tel }, "☎ Chiama " + s.tel)),
    s.incasso && !s.annullato
      ? h("div", { class: "inc" }, h("small", {}, "Da incassare dai passeggeri"), h("b", {}, euro(s.incasso)),
          h("small", { style: "text-transform:none;font-weight:600" }, "in contanti: li tieni tu" + (titolare && s.fonte_incasso === "stima" ? " (importo stimato)" : "")))
      : !s.annullato && h("div", { class: "nonInc" }, "Niente da incassare"),
    h("div", { class: "quota" }, h("span", {}, "La tua quota (IVA esclusa)"), h("b", {}, s.quota ? euro(s.quota) : "da definire")),
    s.nota && h("div", { class: "nota" }, s.nota),
    h("div", { class: "id" }, "n. " + s.id));
}

function prossimi() {
  const oggi = oggiRoma();
  const lista = S.dati.servizi.filter((s) => s.data >= oggi && !s.annullato);
  if (!lista.length) return h("div", { class: "vuoto" }, "Nessun servizio in programma.");
  const out = [];
  let giorno = "";
  for (const s of lista) {
    if (s.data !== giorno) { giorno = s.data; out.push(h("div", { class: "giorno" }, giornoLabel(giorno))); }
    out.push(card(s, S.dati.ruolo === "titolare"));
  }
  return out;
}

const mesiDisponibili = () => [...new Set(S.dati.servizi.map((s) => s.data.slice(0, 7)))].sort().reverse();
function meseCorrente() {
  const ms = mesiDisponibili();
  if (!S.mese || !ms.includes(S.mese)) { const ora = oggiRoma().slice(0, 7); S.mese = ms.includes(ora) ? ora : ms[0]; }
  return S.mese;
}
function selettoreMesi() {
  return h("div", { class: "mesi" }, mesiDisponibili().map((m) =>
    h("button", { "aria-pressed": String(m === meseCorrente()), onclick: () => { S.mese = m; S.aperto = null; disegna(); } }, nomeMese(m).replace(/ \d{4}$/, ""))));
}

function elenco() {
  const m = meseCorrente();
  const q = S.q.trim().toLowerCase();
  const tutti = S.dati.servizi.filter((s) => s.data.slice(0, 7) === m);
  const buoni = tutti.filter((s) => !s.annullato);
  const quote = buoni.reduce((a, s) => a + (s.quota || 0), 0);
  const senza = buoni.filter((s) => !s.quota).length;
  const filtrati = tutti.filter((s) => !q || [s.nome, s.da, s.a, s.volo, s.mezzo, String(s.id)].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (b.data + b.ora).localeCompare(a.data + a.ora));
  return [selettoreMesi(),
    h("div", { class: "riepilogo" }, h("div", { class: "mese" }, nomeMese(m)), h("div", { class: "big" }, euro(quote)),
      h("div", { class: "sub" }, "la tua quota, IVA esclusa · " + buoni.length + " servizi" + (senza ? " · " + senza + " senza quota (da definire)" : ""))),
    h("input", { type: "search", placeholder: "Cerca nome, luogo, volo…", value: S.q, oninput: (e) => { S.q = e.target.value; const pos = e.target.selectionStart; disegna(); const i = document.querySelector("input[type=search]"); i.focus(); i.setSelectionRange(pos, pos); } }),
    h("div", { class: "lista" }, filtrati.length ? filtrati.map((s) => {
      const apri = S.aperto === s.id;
      return h("div", {},
        h("button", { class: "riga-el" + (s.annullato ? " annullato" : ""), "aria-expanded": String(apri), onclick: () => { S.aperto = apri ? null : s.id; disegna(); } },
          h("div", { class: "a" }, h("span", { class: "t" }, luogo(s.da) + " → " + luogo(s.a)), h("span", { class: "q" }, s.annullato ? "annullato" : s.quota ? euro(s.quota) : "da definire")),
          h("div", { class: "m" }, badgeMezzo(s.mezzo)),
          h("div", { class: "d" }, giornoBreve(s.data) + " · " + (s.ora || "")),
          s.incasso && !s.annullato && h("span", { class: "badge" }, "INCASSARE " + euro(s.incasso))),
        apri && h("div", { class: "dentro" }, card(s, S.dati.ruolo === "titolare")));
    }) : h("div", { class: "vuoto", style: "margin:20px" }, "Nessun servizio.")),
    h("div", { class: "fine" }, "Il prezzo a destra è la tua quota, IVA esclusa.")];
}

function conto() {
  const m = meseCorrente();
  const buoni = S.dati.servizi.filter((s) => s.data.slice(0, 7) === m && !s.annullato).sort((a, b) => (b.data + b.ora).localeCompare(a.data + a.ora));
  const quote = buoni.reduce((a, s) => a + (s.quota || 0), 0);
  const cont = buoni.reduce((a, s) => a + (s.incasso || 0), 0);
  const saldo = quote - cont;
  const stimati = buoni.filter((s) => s.incasso && s.fonte_incasso === "stima").length;
  const senza = buoni.filter((s) => !s.quota).length;
  return [selettoreMesi(),
    h("div", { class: "riepilogo" }, h("div", { class: "mese" }, nomeMese(m)),
      h("div", { class: "tot" }, h("span", {}, "Quote di Dario (IVA esclusa)"), h("b", {}, euro(quote))),
      h("div", { class: "tot" }, h("span", {}, "Contanti che Dario trattiene"), h("b", {}, "−" + euro(cont))),
      h("div", { class: "saldo" }, h("span", {}, saldo >= 0 ? "Gli dobbiamo" : "Ci deve"), h("span", {}, euro(Math.abs(saldo)))),
      h("div", { class: "sub", style: "margin-top:8px" }, buoni.length + " servizi" + (stimati ? " · " + stimati + " contanti stimati dal prezzo (≈)" : "") + (senza ? " · " + senza + " senza quota, non nel totale" : ""))),
    h("div", { class: "lista" }, buoni.map((s) => {
      const d = (s.quota || 0) - (s.incasso || 0);
      return h("div", { class: "riga-el", style: "cursor:default" },
        h("div", { class: "a" }, h("span", { class: "t" }, luogo(s.da) + " → " + luogo(s.a)), h("span", { class: "q " + (d < 0 ? "neg" : "pos") }, (d >= 0 ? "+" : "−") + Math.abs(d).toLocaleString("it-IT"))),
        h("div", { class: "d" }, giornoBreve(s.data) + " · quota " + (s.quota ? euro(s.quota) : "da definire") + (s.incasso ? " · contanti " + euro(s.incasso) + (s.fonte_incasso === "stima" ? " ≈" : "") : "")));
    })),
    h("div", { class: "fine" }, "Saldo del mese = quote − contanti incassati da Dario. Solo per te.")];
}

function tabsDisponibili() {
  const t = [["prossimi", "Prossimi"], ["elenco", "Elenco"]];
  if (S.dati.ruolo === "titolare") t.push(["conto", "Il mio conto"]);
  return t;
}

function disegna() {
  const v = document.getElementById("vista");
  const nav = document.getElementById("tabs");
  if (!S.dati) return;
  document.getElementById("titolo").textContent = "Servizi di " + ((S.dati.fornitore && S.dati.fornitore.nome) || "");
  document.title = "Servizi";
  const agg = document.getElementById("agg");
  const quando = S.dati.aggiornato ? new Date(S.dati.aggiornato) : null;
  const vecchio = quando && Date.now() - quando.getTime() > 4 * 36e5;
  agg.textContent = quando ? "Aggiornato alle " + quando.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" }) +
    (vecchio ? " · i dati sono vecchi" : "") + (S.offline ? " · senza rete" : "") : "";
  agg.className = vecchio || S.offline ? "vecchio" : "";
  const tabs = tabsDisponibili();
  if (!tabs.some(([k]) => k === S.tab)) S.tab = "prossimi";
  nav.hidden = tabs.length < 2;
  nav.replaceChildren(...tabs.map(([k, n]) => h("button", { role: "tab", "aria-selected": String(k === S.tab), onclick: () => { S.tab = k; S.aperto = null; disegna(); window.scrollTo(0, 0); } }, n)));
  const y = window.scrollY;
  v.replaceChildren(...[].concat(S.tab === "elenco" ? elenco() : S.tab === "conto" ? conto() : prossimi()));
  window.scrollTo(0, y);
}

function errore(titolo, testo) {
  document.getElementById("agg").textContent = "";
  document.getElementById("vista").replaceChildren(h("div", { class: "errore" }, h("b", {}, titolo), testo));
}

async function carica() {
  if (!/^[A-Za-z0-9]{32,64}$/.test(token)) return errore("Link non valido", "Chiedi il link giusto a chi te l'ha dato.");
  const chiave = "srv-" + token.slice(0, 8);
  try {
    const r = await fetch(API + "?t=" + encodeURIComponent(token), { cache: "no-store" });
    if (r.status === 404) { try { localStorage.removeItem(chiave); } catch (e) { /* niente */ } return errore("Link non valido", "Chiedi il link giusto a chi te l'ha dato."); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.dati = await r.json();
    S.offline = false;
    try { localStorage.setItem(chiave, JSON.stringify(S.dati)); } catch (e) { /* senza memoria: va bene lo stesso */ }
  } catch (e) {
    let vecchi = null;
    try { vecchi = JSON.parse(localStorage.getItem(chiave) || "null"); } catch (x) { /* niente */ }
    if (!vecchi) return errore("Non riesco a caricare", "Controlla la connessione e riprova.");
    S.dati = vecchi;
    S.offline = true;
  }
  disegna();
}

carica();
setInterval(() => { if (document.visibilityState === "visible") carica(); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carica(); });
</script>
</body>
</html>
