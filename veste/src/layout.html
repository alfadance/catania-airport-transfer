<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/favicon-cat.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
{{head}}
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div id="cookie-consent-banner" class="cookie-banner" role="dialog" tabindex="-1" aria-label="Cookie consent" aria-describedby="cookie-consent-text" hidden>
  <p id="cookie-consent-text">We use cookies and similar technologies for analytics (Google Analytics) to improve our site. No tracking runs until you accept. <a href="/privacy.html">Privacy policy</a></p>
  <div class="cookie-actions">
    <button type="button" id="cookie-consent-reject" class="outline-button">Reject non-essential</button>
    <button type="button" id="cookie-consent-accept" class="solid-button">Accept</button>
  </div>
</div>
{{header}}
{{body}}
{{footer}}
{{scripts}}
</body>
</html>
